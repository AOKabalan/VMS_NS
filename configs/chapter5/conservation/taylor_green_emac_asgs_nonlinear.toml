case = "taylor_green_2d"
run_name = "taylor_green_emac_asgs_nonlinear"

[case_parameters]
viscosity = 0.01

[mesh]
cells = [
    32,
    32,
]

[discretization]
velocity_degree = 1
pressure_degree = 1

[time]
scheme = "crank_nicolson"
dt = 0.005
t_end = 0.5
startup = "lower_order"

[stabilization]
method = "vms"
subscale_space = "asgs"
subscale_dynamics = "dynamic"
scale_splitting = "nonlinear"
c1 = 4.0
c2 = 2.0
pressure_subscale = true

[convection]
form = "emac"

[viscosity]
form = "stress"

[solver]
linearization = "newton"
newton_tau = "frozen"
picard_iterations_before_newton = 0
inner_rtol = 1e-12
inner_atol = 1e-12
inner_max_iterations = 30
outer_rtol = 1e-11
outer_max_iterations = 100
subscale_update = "accelerated"
subscale_rtol = 1e-13
subscale_max_iterations = 50

[solver.petsc]
ksp_type = "preonly"
pc_type = "lu"
pc_factor_mat_solver_type = "mumps"

[output]
vtk_every = 10
diagnostics = [
    "kinetic_energy",
    "subscale_kinetic_energy",
    "linear_momentum",
    "energy_budget",
    "momentum_budget",
    "linear_momentum_defect",
    "linear_momentum_defect_predicted",
    "convective_energy_defect",
    "velocity_error_l2",
]
console_level = "INFO"
