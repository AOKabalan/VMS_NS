case = "differentially_heated_cavity"
run_name = "cavity_ra10000"

[case_parameters]
rayleigh = 10000.0
prandtl = 0.71
aspect_ratio = 1.0
initial_profile = "conduction"

[mesh]
cells = [16, 16]

[discretization]
velocity_degree = 2
pressure_degree = 2

[time]
scheme = "bdf2"
dt = 0.2
t_end = 150.0

[thermal]
convection = "skew_symmetric"

[output]
vtk_every = 250
diagnostics = ["kinetic_energy", "angular_momentum", "thermal_content", "cavity_nusselt"]
