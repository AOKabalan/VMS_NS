case = "manufactured_boussinesq"
run_name = "galerkin_conservative"

[mesh]
cells = [8, 8]

[discretization]
velocity_degree = 2
pressure_degree = 1

[stabilization]
method = "none"

[time]
scheme = "bdf1"
dt = 0.01
t_end = 0.1

[thermal]
convection = "conservative"

[output]
vtk_every = 5
diagnostics = ["kinetic_energy", "divergence_l2", "temperature_l2", "temperature_error_l2", "thermal_content", "buoyancy_power"]

[solver.petsc]
ksp_type = "preonly"
pc_type = "lu"
pc_factor_mat_solver_type = "mumps"
mat_mumps_icntl_24 = 1
