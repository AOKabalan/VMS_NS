case = "kelvin_helmholtz_shear_layer"
run_name = "b75_cloud_visualization_pilot"

[case_parameters]
n_waves = 4
reynolds = 1000.0
richardson = 0.1
prandtl = 1.0
schmidt = 1.0
epsilon = 0.02
epsilon_noise = 0.01
random_seed = 1729
moisture = true
rh_peak = 0.97
moisture_width = 1.5
saturation_height_rate = 0.03
saturation_temperature_rate = 0.0
clustering = 1.5

[mesh]
cells = [96, 64]

[stabilization]
subscale_space = "oss"
subscale_dynamics = "static"
scale_splitting = "linear"

[thermal]
convection = "conservative"

[time]
scheme = "bdf2"
dt = 0.2
t_end = 80.0

[solver.petsc]
ksp_type = "preonly"
pc_type = "lu"
pc_factor_mat_solver_type = "mumps"
mat_mumps_icntl_24 = 1

[output]
vtk_every = 5
console_level = "WARNING"
diagnostics = ["kinetic_energy", "vertical_kinetic_energy", "divergence_l2", "advective_cfl", "thermal_content", "temperature_extrema", "passive_scalar_content", "thermal_content_budget", "boussinesq_energy_budget"]
