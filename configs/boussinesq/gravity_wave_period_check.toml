case = "internal_gravity_wave"
run_name = "gravity_wave_period_check_final"

[case_parameters]
n_waves = 1
displacement_amplitude = 0.01
moisture = false
diffusivity = 0.01
rh_peak = 0.98
moisture_width = 1.2
saturation_height_rate = 0.3

[mesh]
cells = [16, 12]

[discretization]
velocity_degree = 2
pressure_degree = 2

[stabilization]
subscale_space = "oss"
subscale_dynamics = "dynamic"
scale_splitting = "linear"

[thermal]
convection = "skew_symmetric"

[time]
scheme = "bdf2"
dt = 0.08781018413800909
t_end = 21.074444193122179

[solver.petsc]
ksp_type = "preonly"
pc_type = "lu"
pc_factor_mat_solver_type = "mumps"
mat_mumps_icntl_24 = 1

[output]
vtk_every = 2
console_level = "WARNING"
diagnostics = ["kinetic_energy", "vertical_kinetic_energy", "divergence_l2", "advective_cfl"]
