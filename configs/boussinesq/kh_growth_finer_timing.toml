case = "kelvin_helmholtz_shear_layer"
run_name = "b73_finer_timing"

[case_parameters]
epsilon = 0.0001
moisture = false

[mesh]
cells = [64, 96]

[time]
scheme = "bdf2"
dt = 0.05
t_end = 0.15

[solver.petsc]
ksp_type = "preonly"
pc_type = "lu"
pc_factor_mat_solver_type = "mumps"
mat_mumps_icntl_24 = 1

[output]
vtk_every = 0
horizontal_profiles_every = 1
horizontal_fourier_modes = [1, 2]
diagnostics = ["kinetic_energy", "vertical_kinetic_energy", "divergence_l2", "advective_cfl", "thermal_content", "temperature_extrema", "boussinesq_energy_budget"]
