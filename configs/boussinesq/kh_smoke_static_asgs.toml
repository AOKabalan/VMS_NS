case = "kelvin_helmholtz_shear_layer"
run_name = "b71_static_asgs"

[mesh]
cells = [24, 24]

[stabilization]
subscale_space = "asgs"
subscale_dynamics = "static"
scale_splitting = "linear"

[time]
scheme = "bdf1"
dt = 0.02
t_end = 0.06

[solver.petsc]
ksp_type = "preonly"
pc_type = "lu"
pc_factor_mat_solver_type = "mumps"
mat_mumps_icntl_24 = 1

[output]
vtk_every = 3
diagnostics = ["kinetic_energy", "vertical_kinetic_energy", "divergence_l2", "advective_cfl", "thermal_content", "passive_scalar_content", "thermal_content_budget", "thermal_variance_budget", "boussinesq_energy_budget"]
