# Prepared only; launch manually. See docs/gresho_exact.md.
case = "gresho_exact"
run_name = "emac_vms_full_oss"

[case_parameters]
viscosity = 0.0

[mesh]
cells = [
    48,
    48,
]

[discretization]
velocity_degree = 1
pressure_degree = 1

[time]
scheme = "crank_nicolson"
dt = 0.01
t_end = 10.0
startup = "none"

[stabilization]
method = "vms"
subscale_space = "oss"
subscale_dynamics = "dynamic"
scale_splitting = "nonlinear"
c1 = 4.0
c2 = 2.0
pressure_subscale = false

[convection]
form = "emac_vms_full"

[viscosity]
form = "stress"

[solver]
linearization = "newton"
newton_tau = "frozen"
picard_iterations_before_newton = 0
inner_rtol = 1e-12
inner_atol = 1e-12
inner_max_iterations = 200
outer_rtol = 1e-11
outer_max_iterations = 100
subscale_update = "accelerated"
subscale_rtol = 1e-13
subscale_max_iterations = 50

[solver.petsc]
ksp_type = "preonly"
pc_type = "lu"
pc_factor_mat_solver_type = "mumps"

[output]
vtk_every = 100
diagnostics = [
    "kinetic_energy",
    "linear_momentum",
    "angular_momentum",
    "velocity_error_l2",
    "pressure_error_l2",
    "divergence_l2",
    "force",
    "region_velocity_l2",
    "total_kinetic_energy",
    "subscale_kinetic_energy",
    "region_subscale_l2",
    "energy_budget",
    "momentum_budget",
    "linear_momentum_defect",
    "angular_momentum_defect",
    "convective_energy_defect",
]
console_level = "INFO"
