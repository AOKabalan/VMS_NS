[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "navier-stokes-vms"
version = "0.1.0"
description = "VMS-stabilized incompressible Navier–Stokes in Firedrake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tomli-w>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ANN", "ARG", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: verification tests that take minutes"]
